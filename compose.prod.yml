# ===========================================
# Docker Compose - Production Configuration
# Usage: podman-compose -f compose.prod.yml up -d
# ===========================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - PYTHON_VERSION=3.12
    image: smartfashion:${APP_VERSION:-2.0.0}
    restart: always
    ports:
      - "${UVICORN_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONOPTIMIZE=2
      - UVICORN_HOST=0.0.0.0
      - UVICORN_PORT=${UVICORN_PORT:-8000}
      - UVICORN_WORKERS=${UVICORN_WORKERS:-2}
      - MODEL_SEGMENT=${MODEL_SEGMENT:-yolo26n-seg.pt}
      - MODEL_SEGMENT_FALLBACK=${MODEL_SEGMENT_FALLBACK:-yolo11n-seg.pt}
      # Database
      - DB_URL=mysql://${DB_USER:-smartfashion}:${DB_PASSWORD}@mariadb:3306/${DB_NAME:-smartfashion}
      # S3-compatible object storage
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - S3_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - S3_BUCKET=${MINIO_BUCKET:-smartfashion}
      - S3_REGION=${MINIO_REGION:-us-east-1}
      # Performance
      - OMP_NUM_THREADS=${OMP_NUM_THREADS:-2}
      - MALLOC_ARENA_MAX=2
    depends_on:
      mariadb:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - smartfashion-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    read_only: false

  mariadb:
    image: mariadb:11
    restart: always
    environment:
      - MARIADB_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MARIADB_DATABASE=${DB_NAME:-smartfashion}
      - MARIADB_USER=${DB_USER:-smartfashion}
      - MARIADB_PASSWORD=${DB_PASSWORD}
      # Performance tuning
      - MARIADB_INNODB_BUFFER_POOL_SIZE=256M
      - MARIADB_INNODB_LOG_FILE_SIZE=64M
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks:
      - smartfashion-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  minio:
    image: minio/minio:latest
    restart: always
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_SERVER_URL=${MINIO_EXTERNAL_ENDPOINT:-http://localhost:9000}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - smartfashion-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  smartfashion-network:
    driver: bridge

volumes:
  mariadb_data:
  minio_data:
