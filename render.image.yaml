# Image-backed web blueprint for Render.
# Replace the image URL with your published registry image.
services:
  - type: web
    runtime: image
    name: smart-fashion
    plan: free
    image:
      url: ghcr.io/your-org/smart-fashion:latest
      # creds:
      #   fromRegistryCreds:
      #     name: ghcr-readonly
    healthCheckPath: /api/healthz
    envVars:
      - key: PORT
        value: "10000"
      - key: UVICORN_WORKERS
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: MODEL_PRELOAD
        value: "false"
      - key: MODEL_SEGMENT
        value: yolov8n-clothing-detection.pt
      - key: DB_URL
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
