<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Fashion AI Segmentation{% endblock %}</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Global Styles -->
    <link rel="stylesheet" href="/static/global.css?v={{ APP_VERSION }}" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    {% block extra_styles %}{% endblock %}

    {% block extra_head %}{% endblock %}
  </head>

  <body class="overflow-x-hidden" data-page="{% block page_identifier %}{% endblock %}" data-app-version="{{ APP_VERSION }}">
    {% block navigation %}{% endblock %}

    <main class="pt-24">
      {% block content %}{% endblock %}
    </main>

    {% block modals %}{% endblock %}

    {% block scripts %}{% endblock %}
  </body>
</html>
