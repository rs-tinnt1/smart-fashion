name: Build and Publish Image

on:
  push:
    branches:
      - main
    paths:
      - app/**
      - templates/**
      - static/**
      - .github/workflows/build-image.yml
      - Dockerfile
      - main.py
      - worker.py
      - pyproject.toml
      - poetry.lock
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Render web deploy
        if: ${{ secrets.RENDER_WEBHOOK_URL != '' }}
        run: curl --fail --silent --show-error -X POST "${{ secrets.RENDER_WEBHOOK_URL }}"

      - name: Trigger Render worker deploy
        if: ${{ secrets.RENDER_WORKER_WEBHOOK_URL != '' }}
        run: curl --fail --silent --show-error -X POST "${{ secrets.RENDER_WORKER_WEBHOOK_URL }}"

      - name: Show published digest
        run: |
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          echo "Digest: ${{ steps.build.outputs.digest }}"
