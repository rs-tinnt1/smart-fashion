# ===========================================
# Docker Compose - Local Demo Infrastructure
# Runs app + worker with local MySQL and MinIO.
# ===========================================

services:
  mysql:
    image: mysql:8.4
    container_name: smartfashion-mysql
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=${DB_NAME:-smartfashion}
      - MYSQL_USER=${DB_USER:-smartfashion}
      - MYSQL_PASSWORD=${DB_PASSWORD:-smartfashion}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
      - MYSQL_TCP_PORT=3306
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u${DB_USER:-smartfashion}", "-p${DB_PASSWORD:-smartfashion}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - smartfashion-network

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    container_name: smartfashion-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - smartfashion-network

  minio-setup:
    image: minio/mc:RELEASE.2025-03-12T17-29-24Z
    container_name: smartfashion-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb --ignore-existing local/${S3_BUCKET:-smartfashion} &&
      mc anonymous set public local/${S3_BUCKET:-smartfashion}
      "
    networks:
      - smartfashion-network

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: smartfashion-dev
    image: smartfashion:${APP_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${UVICORN_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - UVICORN_HOST=0.0.0.0
      - UVICORN_PORT=${UVICORN_PORT:-8000}
      - UVICORN_WORKERS=1
      - MODEL_SEGMENT=${MODEL_SEGMENT:-yolov8n-clothing-detection.pt}
      - OMP_NUM_THREADS=${OMP_NUM_THREADS:-4}
      - DB_URL=${DB_URL:-mysql://smartfashion:smartfashion@mysql:3306/smartfashion}
      - DB_HOST=${DB_HOST:-mysql}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER:-smartfashion}
      - DB_PASSWORD=${DB_PASSWORD:-smartfashion}
      - DB_NAME=${DB_NAME:-smartfashion}
      - DB_SSL=${DB_SSL:-false}
      - S3_ENDPOINT=${S3_ENDPOINT:-http://minio:9000}
      - S3_PUBLIC_ENDPOINT=${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-minioadmin}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-minioadmin}
      - S3_BUCKET=${S3_BUCKET:-smartfashion}
      - S3_REGION=${S3_REGION:-us-east-1}
      - MODEL_PRELOAD=${MODEL_PRELOAD:-false}
    networks:
      - smartfashion-network
    depends_on:
      mysql:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: smartfashion-worker
    image: smartfashion-worker:${APP_VERSION:-latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - MODEL_SEGMENT=${MODEL_SEGMENT:-yolov8n-clothing-detection.pt}
      - OMP_NUM_THREADS=${OMP_NUM_THREADS:-4}
      - DB_URL=${DB_URL:-mysql://smartfashion:smartfashion@mysql:3306/smartfashion}
      - DB_HOST=${DB_HOST:-mysql}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER:-smartfashion}
      - DB_PASSWORD=${DB_PASSWORD:-smartfashion}
      - DB_NAME=${DB_NAME:-smartfashion}
      - DB_SSL=${DB_SSL:-false}
      - S3_ENDPOINT=${S3_ENDPOINT:-http://minio:9000}
      - S3_PUBLIC_ENDPOINT=${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-minioadmin}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-minioadmin}
      - S3_BUCKET=${S3_BUCKET:-smartfashion}
      - S3_REGION=${S3_REGION:-us-east-1}
      - MODEL_PRELOAD=${MODEL_PRELOAD:-false}
    command: python worker.py
    networks:
      - smartfashion-network
    depends_on:
      mysql:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully

networks:
  smartfashion-network:

volumes:
  mysql-data:
  minio-data:
