# ===========================================
# Docker Compose - App + Worker Configuration
# Uses external R2 and MySQL via environment variables.
# ===========================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: smartfashion-dev
    image: smartfashion:${APP_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${UVICORN_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - UVICORN_HOST=0.0.0.0
      - UVICORN_PORT=${UVICORN_PORT:-8000}
      - UVICORN_WORKERS=1
      - MODEL_SEGMENT=${MODEL_SEGMENT:-yolov8n-clothing-detection.pt}
      - OMP_NUM_THREADS=${OMP_NUM_THREADS:-4}
      - DB_URL=${DB_URL}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - S3_BUCKET=${S3_BUCKET:-smartfashion}
      - S3_REGION=${S3_REGION:-auto}
    networks:
      - smartfashion-network
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: smartfashion-worker
    image: smartfashion-worker:${APP_VERSION:-latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - MODEL_SEGMENT=${MODEL_SEGMENT:-yolov8n-clothing-detection.pt}
      - OMP_NUM_THREADS=${OMP_NUM_THREADS:-4}
      - DB_URL=${DB_URL}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - S3_BUCKET=${S3_BUCKET:-smartfashion}
      - S3_REGION=${S3_REGION:-auto}
    command: python worker.py
    networks:
      - smartfashion-network

networks:
  smartfashion-network:
