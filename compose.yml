# ===========================================
# Docker Compose - Development Configuration
# Usage: podman-compose up -d
# ===========================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: smartfashion-dev
    image: smartfashion:${APP_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${UVICORN_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - UVICORN_HOST=0.0.0.0
      - UVICORN_PORT=${UVICORN_PORT:-8000}
      - UVICORN_WORKERS=1
      - MODEL_SEGMENT=${MODEL_SEGMENT:-yolo26n-seg.pt}
      - MODEL_SEGMENT_FALLBACK=${MODEL_SEGMENT_FALLBACK:-yolo11n-seg.pt}
      - OMP_NUM_THREADS=${OMP_NUM_THREADS:-4}
      # Database
      - DB_URL=mysql://${DB_USER:-smartfashion}:${DB_PASSWORD:-smartfashion}@mariadb:3306/${DB_NAME:-smartfashion}
      # S3-compatible object storage
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - S3_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - S3_BUCKET=${MINIO_BUCKET:-smartfashion}
      - S3_REGION=${MINIO_REGION:-us-east-1}
    depends_on:
      mariadb:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - smartfashion-network
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  mariadb:
    image: mariadb:11
    container_name: mariadb
    restart: unless-stopped
    environment:
      - MARIADB_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-rootpassword}
      - MARIADB_DATABASE=${DB_NAME:-smartfashion}
      - MARIADB_USER=${DB_USER:-smartfashion}
      - MARIADB_PASSWORD=${DB_PASSWORD:-smartfashion}
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks:
      - smartfashion-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_SERVER_URL=http://localhost:9000
      - MINIO_BROWSER_REDIRECT_URL=http://localhost:9001
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - smartfashion-network

networks:
  smartfashion-network:

volumes:
  mariadb_data:
  minio_data:
